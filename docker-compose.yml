services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cv_matching_db
    environment:
      POSTGRES_USER: cvuser
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: cv_matching
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvuser -d cv_matching"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
